[package]
name = "portfolio-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "portfolio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
proxy = { path = "../proxy" }
shared = { path = "../shared" }
